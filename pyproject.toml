[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stamp-intelligence-agent"
version = "0.1.0"
description = "Sarvam AI Stamp Intelligence Agent for extraction, validation, and workflow automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rashmi"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.0",
  "opencv-python>=4.10.0.84",
  "numpy>=1.26.0",
  "Pillow>=10.4.0",
  "PyMuPDF>=1.24.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
stamp-agent = "stamp_agent.cli:main"

[tool.setuptools]
packages = ["stamp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
